name: deb

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - scripts/**
      - man/**
      - packaging/debian/**
      - .github/workflows/deb.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb --locked
      - name: Install the package
        run: sudo apt-get install -y ./target/debian/*.deb
      - name: Smoke test
        run: |
          test "$(printf hi | bzip3 -e | bz3cat)" = hi
          bunzip3 --help > /dev/null
          test -e /usr/share/man/man1/bzip3.1.gz
          test -e /usr/share/man/man1/bz3cmp.1.gz
          dpkg-deb -I target/debian/*.deb
          dpkg-deb -c target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
